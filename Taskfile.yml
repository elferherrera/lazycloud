version: "3"

tasks:
  test:
    desc: Run the tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  run:
    desc: Run the TUI locally
    cmds:
      - go run .

  build:
    desc: Build the TUI binary
    cmds:
      - go build -o bin/lazycloud .

  install:
    desc: Install the app to GOPATH/bin
    cmds:
      - go build -o {{.GOPATH}}/bin/lazycloud .
    vars:
      GOPATH:
        sh: go env GOPATH