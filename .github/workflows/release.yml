name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin/arm64
            artifact: lazycloud-darwin-arm64
          - target: darwin/amd64
            artifact: lazycloud-darwin-x86_64
          - target: linux/amd64
            artifact: lazycloud-linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate SemVer tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@v5

      - name: Test
        run: mise exec -- go test ./...

      - name: Build release
        run: |
          IFS='/' read -r goos goarch <<< "${{ matrix.target }}"
          mise exec -- env CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" .

      - name: Verify release version
        run: |
          # darwin binaries cannot run on the linux runner, so their
          # --version is verified by the formula test block at install
          # time instead. The linux/amd64 build runs natively here.
          if [ "${{ matrix.target }}" = "linux/amd64" ]; then
            actual="$(./lazycloud --version)"
            echo "version=$actual"
            test "$actual" = "$GITHUB_REF_NAME"
          else
            echo "cross-compiled darwin binary, --version verified by formula test block"
          fi

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          mv lazycloud dist/${{ matrix.artifact }}/lazycloud
          chmod 755 dist/${{ matrix.artifact }}/lazycloud
          tar -C dist -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          sha256sum dist/${{ matrix.artifact }}.tar.gz > dist/${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: lazycloud ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  publish-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    # The generator ships in this repo, not in the tap: the tap only needs
    # to exist. Regenerates Formula/lazycloud.rb from the published .sha256
    # sidecar files, so checksums always come from the release itself.
    steps:
      - name: Checkout lazycloud
        uses: actions/checkout@v7

      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set in repo secrets. The formula push to the tap is skipped until the secret is added (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # A 401/403 here means expired or wrongly scoped: fail this step so
          # the release page shows the tap update did not happen.
          code="$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $HOMEBREW_TAP_TOKEN" \
              https://api.github.com/repos/elferherrera/homebrew-tap)"
          if [ "$code" != "200" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN was rejected (HTTP $code, expired or missing tap access). Rotate it: Settings > Secrets and variables > Actions > HOMEBREW_TAP_TOKEN."
            exit 1
          fi
          echo "tap token accepted"

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: elferherrera/homebrew-tap
          # Fine-grained PAT, contents:write on elferherrera/homebrew-tap only.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate formula for ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          chmod +x scripts/generate_formula.sh
          # Explicit tag: no latest-release race with the just-published one.
          # The generator syntax-checks the formula with ruby -c before
          # exiting, so a broken formula never reaches the commit step.
          ./scripts/generate_formula.sh tap/Formula/lazycloud.rb "${GITHUB_REF_NAME}"

      - name: Commit when changed
        working-directory: tap
        run: |
          git add Formula/lazycloud.rb
          # --cached catches both a version bump and the very first formula
          # commit on a fresh tap; plain git diff misses untracked files.
          if git diff --cached --quiet; then
            echo "formula already at ${GITHUB_REF_NAME}, nothing to commit"
            exit 0
          fi
          git config user.name "elferherrera-release-bot"
          git config user.email "actions@github.com"
          git commit -m "lazycloud ${GITHUB_REF_NAME#v}"
          git push
